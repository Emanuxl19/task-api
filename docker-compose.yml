version: '3.8'

services:

  # ─── Banco de dados ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: task-api-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskdb}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Cache / Rate Limiting ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: task-api-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Aplicação ───────────────────────────────────────────────────────────
  # Secrets use ${VAR:?msg} so the stack fails fast if a value is missing.
  # Copy .env.example to .env and fill it in before `docker-compose up`.
  app:
    build: .
    container_name: task-api-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-taskdb}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set (see .env.example)}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET must be set}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID must be set}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:-http://localhost:3000/oauth2/callback}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

# ─── Como usar ──────────────────────────────────────────────────────────────
#
# 1. Copie o template de variáveis e preencha os valores:
#    cp .env.example .env
#
# 2. Subir só o banco (para desenvolvimento local):
#    docker-compose up -d postgres
#    ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
#
# 3. Subir tudo (app + banco + redis):
#    docker-compose up -d
#
# Ver logs:
#   docker-compose logs -f app
#
# Parar tudo:
#   docker-compose down
#
# Parar e apagar os dados:
#   docker-compose down -v
