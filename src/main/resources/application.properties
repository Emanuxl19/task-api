# =============================================
# PERFIL PADRÃO — roda localmente sem Docker
# usando banco H2 em memória
# =============================================

spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console H2 — acesse em http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Swagger UI — acesse em http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

spring.application.name=task-api

# ===== JWT =====
# Required. Set via environment or .env (see .env.example).
# Generate with: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# ===== CORS =====
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# ===== OAuth2 (dev — placeholders) =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:placeholder}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:placeholder}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# ===== OAuth2 Redirect =====
app.oauth2.redirect-uri=http://localhost:3000/oauth2/callback

# ===== Redis (desabilitado no perfil default — usa InMemoryRateLimitStore) =====
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
spring.data.redis.repositories.enabled=false

# ===== Rate Limiting =====
app.rate-limit.login-attempts-per-minute=5
app.rate-limit.ai-requests-per-minute=10
app.rate-limit.general-requests-per-minute=60
